name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # ──────────────────────────────────────────────────────────────
  # BACKEND: миграции + pytest
  # ──────────────────────────────────────────────────────────────
  backend:
    name: Backend (Django + pytest)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        ports:
          - 5432:5432
        env:
          POSTGRES_DB: rpgdb
          POSTGRES_USER: rpguser
          POSTGRES_PASSWORD: rpgpass
        options: >-
          --health-cmd "pg_isready -U rpguser -d rpgdb"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgres://rpguser:rpgpass@localhost:5432/rpgdb
      REDIS_URL: redis://localhost:6379/0
      DJANGO_SETTINGS_MODULE: core.settings.test
      SECRET_KEY: ci-test-secret-key-not-for-production
      POSTGRES_DB: rpgdb
      POSTGRES_USER: rpguser
      POSTGRES_PASSWORD: rpgpass
      POSTGRES_HOST: localhost
      POSTGRES_PORT: 5432

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Run migrations
        working-directory: backend
        run: python manage.py migrate --noinput

      - name: Run tests
        working-directory: backend
        run: pytest -q --tb=short

      - name: Django system check
        working-directory: backend
        run: python manage.py check --deploy --fail-level=ERROR
        continue-on-error: true  # warnings о настройках не валят CI

  # ──────────────────────────────────────────────────────────────
  # FRONTEND: lint + build
  # ──────────────────────────────────────────────────────────────
  frontend:
    name: Frontend (Next.js)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Lint
        working-directory: frontend
        run: npm run lint --if-present
        continue-on-error: true  # пока не падаем на lint warnings

      - name: Build
        working-directory: frontend
        env:
          NEXT_PUBLIC_API_BASE: http://localhost:8000/api
        run: npm run build

  # ──────────────────────────────────────────────────────────────
  # SECURITY: проверка зависимостей на известные уязвимости
  # ──────────────────────────────────────────────────────────────
  security:
    name: Security scan
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    if: github.event_name == 'pull_request'

    steps:
      - uses: actions/checkout@v4

      - name: Python pip-audit
        run: |
          python -m pip install --upgrade pip pip-audit
          pip-audit -r backend/requirements.txt --strict || true

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: npm audit (production deps only)
        working-directory: frontend
        run: npm audit --production --audit-level=high || true
