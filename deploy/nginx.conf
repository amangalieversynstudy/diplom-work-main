# nginx reverse-proxy для RPG Academy.
# Ставится на VPS вне docker-compose, слушает 80/443 и пробрасывает:
#   /api/      → backend  (Daphne ASGI, http://127.0.0.1:8000)
#   /ws/       → backend  (WebSocket для Code Runner)
#   /admin/    → backend
#   /docs/     → backend  (Swagger)
#   /static/   → backend  (статика Django)
#   /          → frontend (Next.js, http://127.0.0.1:3000)
#
# SSL через Let's Encrypt:
#   sudo certbot --nginx -d my-domain.tld -d www.my-domain.tld

upstream backend_upstream {
    server 127.0.0.1:8000;
}

upstream frontend_upstream {
    server 127.0.0.1:3000;
}

# HTTP → редирект на HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name my-domain.tld www.my-domain.tld;

    # для верификации Let's Encrypt
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS — основной сервер
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name my-domain.tld www.my-domain.tld;

    # сертификаты ставит certbot, эти пути он же и подставит
    ssl_certificate     /etc/letsencrypt/live/my-domain.tld/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/my-domain.tld/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    client_max_body_size 10M;

    # backend: REST API
    location /api/ {
        proxy_pass http://backend_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # backend: WebSocket для xterm Code Runner
    location /ws/ {
        proxy_pass http://backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # backend: админка + swagger + статика
    location ~ ^/(admin|docs|static)/ {
        proxy_pass http://backend_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # healthcheck
    location = /healthz {
        proxy_pass http://backend_upstream;
    }

    # всё остальное → frontend (Next.js)
    location / {
        proxy_pass http://frontend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
