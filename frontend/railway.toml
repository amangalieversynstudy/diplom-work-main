# Only if the frontend is hosted on Railway as well (it costs RAM on the $5 plan; Vercel hosts it for free).
# Service root directory: frontend. NEXT_PUBLIC_API_BASE must be a service variable: it is baked in at build time.
[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
restartPolicyType = "ON_FAILURE"
