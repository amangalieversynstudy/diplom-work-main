# Bootstrap-конфиг nginx — используется ТОЛЬКО на этапе первой выдачи
# сертификата Let's Encrypt. После успешного `certbot certonly` замени на
# полный nginx.conf и перезапусти контейнер.
#
# Тут нет ssl_certificate — поэтому nginx стартует БЕЗ TLS и может
# обслужить /.well-known/acme-challenge/ для ACME-validation.

user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log notice;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile on;

    server {
        listen 80 default_server;
        server_name _;

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 200 "RPG Academy — bootstrap stage, certbot is issuing TLS...\n";
            add_header Content-Type text/plain;
        }
    }
}
