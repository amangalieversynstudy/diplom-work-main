user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log notice;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    gzip on;
    gzip_types text/plain application/json application/javascript text/css application/xml image/svg+xml;
    gzip_min_length 1024;
    client_max_body_size 4M;

    # лимит зон под защиту от спама на хосте nginx (доп. к DRF throttle)
    limit_req_zone $binary_remote_addr zone=api_zone:10m rate=60r/m;
    limit_req_zone $binary_remote_addr zone=auth_zone:10m rate=10r/m;

    # upstream-блоки
    upstream backend_upstream {
        server backend:8000;
    }
    upstream frontend_upstream {
        server frontend:3000;
    }

    # ── HTTP: ACME-challenge + redirect на HTTPS ─────────────────────
    server {
        listen 80;
        server_name rpg-academy.example.com www.rpg-academy.example.com;

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    # ── HTTPS: основной хост ─────────────────────────────────────────
    server {
        listen 443 ssl http2;
        server_name rpg-academy.example.com www.rpg-academy.example.com;

        ssl_certificate     /etc/letsencrypt/live/rpg-academy.example.com/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/rpg-academy.example.com/privkey.pem;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         HIGH:!aNULL:!MD5;
        ssl_prefer_server_ciphers on;
        ssl_session_cache   shared:SSL:10m;
        ssl_session_timeout 1d;

        # security headers
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "same-origin" always;

        # Django admin + API + Swagger
        location ~ ^/(api|admin|healthz|docs|redoc|swagger\.json)(/|$) {
            limit_req zone=api_zone burst=20 nodelay;
            proxy_pass http://backend_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 60s;
        }

        # Жёстче лимит для аутентификации
        location ~ ^/api/auth/ {
            limit_req zone=auth_zone burst=5 nodelay;
            proxy_pass http://backend_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # WebSocket для песочницы (streaming runner)
        location /ws/ {
            proxy_pass http://backend_upstream;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }

        # Статика Django (admin, DRF, drf-yasg)
        location /static/ {
            alias /usr/share/nginx/static/;
            access_log off;
            expires 30d;
            add_header Cache-Control "public, immutable";
        }

        # Всё остальное — Next.js
        location / {
            proxy_pass http://frontend_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            # Next.js HMR/streaming
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }
    }
}
