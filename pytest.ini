[pytest]
DJANGO_SETTINGS_MODULE = core.settings.test
pythonpath = backend
# Don't search parent directories for manage.py: a stray Django project higher
# up (e.g. D:\manage.py) would shadow backend/users. Paths come from pythonpath above.
django_find_project = false
addopts = -q
asyncio_mode = auto
testpaths =
	backend
	tests
