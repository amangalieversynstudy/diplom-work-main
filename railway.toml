[build]
builder = "dockerfile"
dockerfile = "Dockerfile.backend"

[deploy]
startCommand = "python3 manage.py migrate --noinput; python3 manage.py collectstatic --noinput; gunicorn core.wsgi:application --bind 0.0.0.0:$PORT --workers 2 --timeout 60 --access-logfile -"
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
