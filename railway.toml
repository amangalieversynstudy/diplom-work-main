[build]
builder = "dockerfile"
dockerfile = "Dockerfile.backend"

[deploy]
startCommand = "sh -c 'export DJANGO_SETTINGS_MODULE=core.settings.production; python3 manage.py migrate --noinput && python3 manage.py collectstatic --noinput && (python3 manage.py shell -c "from game.models import MissionTask; MissionTask.objects.filter(pk__in=[1,2,3]).delete()" || true) && (python3 manage.py loaddata ranks class_roles intro_course test_users || true) && exec daphne -b 0.0.0.0 -p ${PORT:-8000} --access-log - core.asgi:application'"
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
