[build]
builder = "dockerfile"
dockerfile = "Dockerfile.backend"

[deploy]
startCommand = "sh -c 'set -x; export DJANGO_SETTINGS_MODULE=core.settings.production; python3 manage.py migrate --noinput && echo MIGRATE_OK || echo MIGRATE_FAILED; python3 manage.py collectstatic --noinput --verbosity 0 && echo STATIC_OK || echo STATIC_FAILED; exec gunicorn core.wsgi:application --bind 0.0.0.0:${PORT:-8000} --workers 2 --timeout 60 --access-logfile - --error-logfile - --log-level debug'"
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
