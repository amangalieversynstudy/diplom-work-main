# Railway, Hobby plan: this backend service plus the Postgres database. No Redis is needed (one process, see
# CACHES in backend/core/settings/base.py). Leave the dashboard's "Custom Start Command" EMPTY: it would override
# the image's CMD, which runs `manage.py release` (migrate, superuser, built-in courses) and then ONE Daphne process.
[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile.backend"

[deploy]
healthcheckPath = "/healthz"
# the first start migrates an empty database before the server listens
healthcheckTimeout = 300
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5
