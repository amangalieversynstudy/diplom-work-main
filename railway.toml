[build]
builder = "dockerfile"
dockerfile = "Dockerfile.backend"

[deploy]
startCommand = '''sh -c "export DJANGO_SETTINGS_MODULE=core.settings.production && python3 manage.py migrate --noinput && python3 manage.py collectstatic --noinput && python3 manage.py seed_course && exec daphne -b 0.0.0.0 -p ${PORT:-8000} --access-log - core.asgi:application"'''
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
