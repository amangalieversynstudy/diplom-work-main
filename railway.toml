[build]
builder = "dockerfile"
dockerfile = "Dockerfile.backend"

[deploy]
startCommand = "sh -c 'export DJANGO_SETTINGS_MODULE=core.settings.production; python3 manage.py migrate --noinput && python3 manage.py collectstatic --noinput && exec gunicorn core.wsgi:application --bind 0.0.0.0:${PORT:-8000} --workers 2 --timeout 60 --access-logfile - --error-logfile -'"
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
